status-website:
  # Use GitHub Pages until a dedicated status hostname is configured.
  baseUrl: /homelab-uptime
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Cooked Beer Homelab Status
  introTitle: "**Cooked Beer homelab status**"
  introMessage: Public service checks run from GitHub Actions. Access-gate checks validate the expected unauthenticated redirect, not authenticated application use; internal service and cluster health are monitored separately by Gatus in the homelab.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

